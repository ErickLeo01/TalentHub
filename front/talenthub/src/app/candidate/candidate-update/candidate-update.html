<h1>Página para atualização dos dados do candidato</h1>

<form (ngSubmit)="updateCandidate()">

<label for="name"> Nome:</label>
<input type="text" id="name" name="name" [(ngModel)]="candidate.name" placeholder="Digite seu nome" required>

<label for="email"> E-mail:</label>
<input type="email" id="email" name="email" [(ngModel)]="candidate.email" placeholder="Digite seu e-mail" required>

<label for="password"> Senha:</label>
<input type="password" id="password" name="password" [(ngModel)]="candidate.password" placeholder="Digite sua senha" required>

<label for="cpf"> CPF:</label>
<input type="text" id="cpf" name="cpf" [(ngModel)]="candidate.cpf" placeholder="Digite seu CPF" required>

 <label for="description">Descrição:</label>
<textarea id="description" name="description" [(ngModel)]="candidate.description" placeholder="Descreva suas habilidades e experiências" required ></textarea>

<button type="submit">Atualizar Cadastro</button>
</form>
