@if (loading) {
  <p>Carregando dados do candidato...</p>
} @else {
  <form (ngSubmit)="updateCandidate()">
    <div>
      <label>Nome:</label>
      <input type="text" [(ngModel)]="candidate.name" name="name" />
    </div>
    <div>
      <label>E-mail:</label>
      <input type="email" [(ngModel)]="candidate.email" name="email" />
    </div>
    <div>
      <label>Descrição:</label>
      <textarea [(ngModel)]="candidate.description" name="description"></textarea>
    </div>

    <button type="submit" [disabled]="saving">
      {{ saving ? 'Salvando...' : 'Salvar Alterações' }}
    </button>
  </form>
}

@if (errorMessage) {
  <p style="color: red;">{{ errorMessage }}</p>
}

<button (click)="goBack()">Voltar</button>
