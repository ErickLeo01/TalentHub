<h1>Atualizar dados do candidato</h1>

<p *ngIf="loading">Carregando dados do candidato...</p>

<p *ngIf="message">{{ message }}</p>
<p *ngIf="errorMessage">{{ errorMessage }}</p>

<form
  *ngIf="!loading && !errorMessage"
  (ngSubmit)="updateCandidate()"
>
  <label for="name">Nome:</label>
  <input
    type="text"
    id="name"
    name="name"
    [(ngModel)]="candidate.name"
    placeholder="Digite seu nome"
  >

  <label for="email">E-mail:</label>
  <input
    type="email"
    id="email"
    name="email"
    [(ngModel)]="candidate.email"
    placeholder="Digite seu e-mail"
  >

  <label for="password">Nova senha:</label>
  <input
    type="password"
    id="password"
    name="password"
    [(ngModel)]="candidate.password"
    placeholder="Deixe vazio para manter a senha atual"
  >

  <label for="cpf">Novo CPF:</label>
  <input
    type="text"
    id="cpf"
    name="cpf"
    [(ngModel)]="candidate.cpf"
    placeholder="Deixe vazio para manter o CPF atual"
  >

  <label for="description">Descrição:</label>
  <textarea
    id="description"
    name="description"
    [(ngModel)]="candidate.description"
    placeholder="Descreva suas habilidades e experiências"
  ></textarea>

  <button type="submit" [disabled]="saving">
    {{ saving ? 'Salvando...' : 'Atualizar cadastro' }}
  </button>
</form>

<button type="button" (click)="router.navigate(['/candidatos'])">
  Voltar
</button>
