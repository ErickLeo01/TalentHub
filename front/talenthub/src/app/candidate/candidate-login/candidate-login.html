<h1>Página de login do candidato</h1>

<form (ngSubmit)="loginCandidate()">

  <label for="username">E-mail:</label>
  <input type="email"id="username" name="username" [(ngModel)]="candidateLogin.username" placeholder="Digite seu e-mail" required>

  <label for="password">Senha:</label>
  <input type="password" id="password" name="password" [(ngModel)]="candidateLogin.password" placeholder="Digite sua senha" required>

  <button type="submit">Entrar</button>

</form>

<a routerLink="/candidatos/create">Não possui cadastro? Clique aqui para se cadastrar</a>
