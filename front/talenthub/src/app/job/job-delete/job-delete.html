
<div class="page-container">
  <section class="delete-card">
    <div class="warning-icon" aria-hidden="true">!</div>

    <span class="eyebrow">TALENTHUB</span>
    <h1>Excluir vaga</h1>

    <p class="description">
      Tem certeza de que deseja excluir esta vaga?
      Essa ação não poderá ser desfeita.
    </p>

    <div class="job-reference">
      <span>ID da vaga</span>
      <strong>{{ jobId || 'Não informado' }}</strong>
    </div>

    <div *ngIf="errorMessage" class="alert alert-error" role="alert">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="alert alert-success" role="status">
      {{ successMessage }}
    </div>

    <div class="button-group">
      <button
        type="button"
        class="btn btn-danger"
        (click)="deleteJob()"
        [disabled]="!jobId || loading"
      >
        {{ loading ? 'Excluindo...' : 'Sim, excluir vaga' }}
      </button>

      <a routerLink="/vagas" class="btn btn-secondary">
        Cancelar
      </a>
    </div>

    <p class="security-note">
      A exclusão será validada pelo servidor antes de ser concluída.
    </p>
  </section>
</div>
