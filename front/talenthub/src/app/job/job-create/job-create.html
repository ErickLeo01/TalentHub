
<div class="page-container">
  <section class="form-card">
    <header class="page-header">
      <span class="eyebrow">TALENTHUB</span>
      <h1>Cadastrar vaga</h1>
      <p>Preencha os dados para publicar uma nova oportunidade.</p>
    </header>

    <form #jobForm="ngForm" (ngSubmit)="createJob()">
      <div class="form-group">
        <label for="name">Nome da vaga</label>
        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="job.name"
          placeholder="Ex.: Desenvolvedor Java Júnior"
          required
          maxlength="150"
        />
      </div>

      <div class="form-group">
        <label for="description">Descrição</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="job.description"
          placeholder="Descreva as responsabilidades e os requisitos..."
          rows="5"
          required
        ></textarea>
      </div>

      <div class="form-group">
        <label for="salary">Salário (R$)</label>
        <input
          id="salary"
          name="salary"
          type="number"
          [(ngModel)]="job.salary"
          placeholder="Ex.: 2500"
          min="0.01"
          step="0.01"
          required
        />
      </div>

      <div class="form-group">
        <label for="benefits">Benefícios</label>
        <textarea
          id="benefits"
          name="benefits"
          [(ngModel)]="job.benefits"
          placeholder="Ex.: Vale-transporte, vale-refeição, plano de saúde..."
          rows="3"
          required
        ></textarea>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="jobForm.invalid"
      >
        Cadastrar vaga
      </button>
    </form>
  </section>
</div>
